name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle Wrapper
      # Generates the gradlew script if not present, and makes it executable
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Setup Gradle Build Action
      uses: gradle/actions/setup-gradle@v4

    - name: Restore Keystore File
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored successfully from base64"
        else
          echo "debug.keystore.base64 not found, generating a brand new debug.keystore dynamically using keytool..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Run Code Linter
      run: ./gradlew lintDebug --continue

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --continue

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WSH-Corporates-POS-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

    - name: Create GitHub Release and Upload APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "WSH Corporates Latest Build (v1.1)"
        body: |
          ### 🚀 Latest Build Completed Successfully!
          
          Here is your raw, unzipped APK with all latest features (Multi-item billing, discount %, customer mobile recording, Saudi ZATCA invoice, savings messages). You can download and install it directly on your Android phone:
          
          👉 **[Download app-debug.apk Directly](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)** (No unzip needed!)
          
          _Build Run: ${{ github.run_number }} | Commit: ${{ github.sha }}_
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
        make_latest: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
